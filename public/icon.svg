<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- App Rounded Background Container -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="rgba(59, 130, 246, 0.3)" stroke-width="4"/>

  <!-- Glowing Grid Lines -->
  <line x1="80" y1="360" x2="432" y2="360" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3" stroke-dasharray="6,6"/>
  <line x1="80" y1="260" x2="432" y2="260" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3" stroke-dasharray="6,6"/>
  <line x1="80" y1="160" x2="432" y2="160" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- Glowing Candlestick Up -->
  <line x1="160" y1="200" x2="160" y2="340" stroke="#10b981" stroke-width="4"/>
  <rect x="146" y="230" width="28" height="80" rx="6" fill="#10b981"/>

  <!-- Candlestick Down -->
  <line x1="240" y1="230" x2="240" y2="380" stroke="#ef4444" stroke-width="4"/>
  <rect x="226" y="260" width="28" height="70" rx="6" fill="#ef4444"/>

  <!-- Dynamic Bullish Trend Line with Glow -->
  <polyline 
    points="80,380 160,260 240,310 330,170 432,110" 
    fill="none" 
    stroke="url(#chartGrad)" 
    stroke-width="26" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Arrow Peak Head -->
  <polygon points="432,110 385,115 410,140" fill="#34d399"/>
  <circle cx="432" cy="110" r="14" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
</svg>
